version: '3.9'

services:
  # ─── API ────────────────────────────────────────────────────
  api:
    build: .
    container_name: careergraph-api
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=mongodb://mongo:27017/careergraph?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── MongoDB (single-node replica set for transaction support) ──
  mongo:
    image: mongo:7
    container_name: careergraph-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
    command: ['--replSet', 'rs0', '--bind_ip_all']
    healthcheck:
      test: |
        mongosh --eval "
          try {
            rs.status();
          } catch(e) {
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]});
          }
        " --quiet
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: careergraph-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mongo_data:
  redis_data:
